name: Split Markdown into mini files

on:
  workflow_dispatch:
  push:
    paths:
      - 'data_warehouse.md'
      - 'scripts/markdown_splitter.py'
      - '.github/workflows/split-markdown.yml'

permissions:
  contents: write

concurrency:
  group: markdown-splitter
  cancel-in-progress: false

jobs:
  split-markdown:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Split Markdown
        run: |
          python scripts/markdown_splitter.py \
            --source data_warehouse.md \
            --output docs/data_warehouse

      - name: Validate generated links
        run: |
          python scripts/markdown_splitter.py \
            --validate \
            --source data_warehouse.md \
            --output docs/data_warehouse

      - name: Commit generated Markdown
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data_warehouse.md docs/data_warehouse
            git commit -m "Split Markdown into mini files"
            git push
          else
            echo "No generated changes to commit."
          fi
